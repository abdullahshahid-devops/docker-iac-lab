services:
  web:
    build: ./web-app
    ports:
      - "5000"
    environment:
      ENVIRONMENT: production
    depends_on:
      - db
    networks:
      - iac-network

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: iacdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: labpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - iac-network

networks:
  iac-network:
    driver: bridge

volumes:
  postgres-data:
