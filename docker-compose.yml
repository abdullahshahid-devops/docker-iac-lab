services:
  web:
    image: docker-iac-lab-web:latest
    build: ./web-app
    ports:
      - "5000"
    environment:
      ENVIRONMENT: production
    depends_on:
      - db
    networks:
      - iac-network

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: iacdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: labpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - iac-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - iac-network

networks:
  iac-network:
    driver: bridge

volumes:
  postgres-data:
