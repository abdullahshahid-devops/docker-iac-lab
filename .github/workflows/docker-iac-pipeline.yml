name: Docker IaC Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t docker-iac-web:test ./web-app

      - name: Run container
        run: docker run -d --name iac-test -p 5000:5000 docker-iac-web:test

      - name: Test health endpoint
        run: |
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:5000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs iac-test
          exit 1
